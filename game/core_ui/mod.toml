# The engine's reference HUD.
#
# NOTE: the mod id is `core_ui`, not `core`. A mod owns only its own id as a
# registration namespace — the same rule `core_tools` follows, and the reason a
# third-party mod cannot shadow engine content.
id = "core_ui"
name = "Core UI"
version = "0.1.0"
description = "Reference HUD. A test fixture, not a game."
license = "GPL-3.0-only"
# A reference implementation and test fixture, not content: it loads before
# every other mod, loses a tie the lowest id would win, steps aside for a mod
# that declares it replaces this one, and the client lists it apart. See
# game/README.md.
reference = true

# A player setting declared in the manifest (UI ask 20), so the start screen
# can show it under this mod's row before any world is open. It is the same
# thing `game.register_setting` makes; a mod declares it one way or the other,
# never both. The Lua reads it with `game.setting`.
[[setting]]
id = "show_cost"
name = "Show the cost of a cut"
description = "The units one chiselled item costs, under the shape editor."
default = 1
