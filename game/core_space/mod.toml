# The engine's reference space: a star you can visit.
#
# The mod id is `core_space`, following the same rule as `core_sky`: a mod owns
# only its own id as a registration namespace.
id = "core_space"
name = "Core Space"
version = "0.1.0"
depends = ["core >=0.1"]
description = "A body at every star, a sky of its own on each. A test fixture, not a game."
license = "GPL-3.0-only"
# A reference implementation and test fixture, not content: it loads before
# every other mod, loses a tie the lowest id would win, steps aside for a mod
# that declares it replaces this one, and the client lists it apart. See
# game/README.md.
reference = true
