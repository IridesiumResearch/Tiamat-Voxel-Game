# The engine's reference fluid.
#
# The directory is `core_milk` and the mod id is `core_milk`, unlike
# `core_blocks` whose id is `core`: that one owns the reserved `core` namespace
# because the engine's own reference blocks live there. A fluid does not need
# to, and a mod that claims no more namespace than it uses is the better
# example to copy.
id = "core_milk"
name = "Core Milk"
version = "0.1.0"
description = "Reference fluid registration. A test fixture, not a game."
license = "GPL-3.0-only"
# A reference implementation and test fixture, not content: it loads before
# every other mod, loses a tie the lowest id would win, steps aside for a mod
# that declares it replaces this one, and the client lists it apart. See
# game/README.md.
reference = true

# The block this fluid is drawn as lives here too, so the mod is self-contained
# and a reader has one directory to look at rather than two.
