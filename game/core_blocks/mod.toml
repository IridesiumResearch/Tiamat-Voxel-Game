# The engine's reference block set.
#
# NOTE: the directory is `core_blocks` but the mod id is `core`. Directory name
# and mod id are deliberately independent — the id is what forms the
# registration namespace, and `core:white` is the string id this mod exists to
# provide. Only the mod whose id is `core` may register into the `core`
# namespace, which is what stops a third-party mod shadowing engine blocks.
id = "core"
name = "Core Blocks"
version = "0.1.0"
description = "Reference block registrations. A test fixture, not a game."
license = "GPL-3.0-only"
# A reference implementation and test fixture, not content: it loads before
# every other mod, loses a tie the lowest id would win, steps aside for a mod
# that declares it replaces this one, and the client lists it apart. See
# game/README.md.
reference = true
