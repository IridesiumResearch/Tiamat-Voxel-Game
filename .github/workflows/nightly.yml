#
# The slow checks: benchmarks, sustained load, and the two soaks.
#
# Separate from `ci.yml` on purpose. These take minutes and are noisy on shared
# runners, and a gate that makes every push slow is a gate people route around.
# CI stays fast and blocking; this runs nightly and on demand.

name: nightly

on:
  schedule:
    # 04:00 UTC, when GitHub's shared runners are least contended. Benchmark
    # numbers from a busy runner are noise wearing a number's clothes.
    - cron: "0 4 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  macro-bench:
    name: macro benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The gate. `bot bench` exits non-zero if p99 is more than 2x the
      # committed baseline, and refuses outright if the workload does not match
      # the baseline's — comparing a different workload measures the parameters
      # rather than the server.
      - name: Macro benchmark, gated against the baseline
        run: ./scripts/bench.sh gate

      # Uploaded whether or not the gate passed: a regression is exactly when
      # the numbers are worth reading.
      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macro-bench-${{ github.sha }}
          path: target/bench/macro.json
          if-no-files-found: error

  swarm-load:
    name: swarm load (20 bots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Release, because a debug build measures rustc's inlining decisions
      # rather than the engine. `--ignored` because the test opts out of the
      # fast loop a developer runs twenty times an hour.
      - name: Twenty bots for sixty seconds
        env:
          SWARM_OUT: target/swarm
        run: cargo test -p bot --test swarm_load --release -- --ignored --nocapture

      # The tick table, kept whether or not the gate passed: a red run is
      # exactly when it is worth reading.
      - name: Keep the tick table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-load-${{ github.sha }}
          path: target/swarm/
          if-no-files-found: warn

  # Milestone 0.5.0, T3: the two soaks, in release, with their tables kept.
  #
  # The fast CI loop proves nothing about a server under its stated load for
  # longer than a minute, and the fen soak that found the relight cost
  # (docs/performance-state-2026-10-12.md) was run by hand on one machine. A
  # shared runner is not the reference machine — the numbers that decide the
  # milestone's exit criteria are read there — but a soak that starts failing
  # or slowing here is a regression worth reading before it reaches one.
  swarm-soak:
    name: swarm soak (50 bots, five minutes)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The performance target's player count (docs/performance-targets.md:
      # fifty players, a 50 ms tick) at the swarm's own workload — walking,
      # digging — for five minutes. The gates are the test's: a tenth of the
      # ticks over budget, one stall at most, and bounded memory.
      - name: Fifty bots for five minutes
        env:
          SWARM_BOTS: 50
          SWARM_SECONDS: 300
          SWARM_OUT: target/swarm
        run: cargo test -p bot --test swarm_load --release -- --ignored --nocapture

      - name: Keep the tick table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swarm-soak-${{ github.sha }}
          path: target/swarm/
          if-no-files-found: warn

  fen-soak:
    name: fen soak (one player over the default mods)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The default mods are separate repositories, and a runner has none
      # beside this checkout. Each is taken at the commit bundle.toml pins —
      # what a release would ship — by the same helper the packaging uses.
      - name: The default mods at their pinned commits
        run: bash scripts/fetch-mods.sh

      # One player flying over the World mod's fen for four minutes, then
      # standing for two: the workload that put nine tenths of a tick in
      # relighting before the light thread. Nothing is asserted; the table is
      # the verdict, and it is kept below for a person to read.
      - name: Fly over the fen
        env:
          FEN_OUT: target/fen
        run: cargo test -p bot --test fen_soak --release -- --ignored --nocapture

      # The soak passes quietly when a mod it needs is not in game/, which on
      # a developer's machine is the right thing and here would be a green
      # job that flew nothing. The table is the proof that it flew.
      - name: The soak flew
        run: test -s target/fen/table.txt && cat target/fen/table.txt

      - name: Keep the tick table, the samples and the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fen-soak-${{ github.sha }}
          path: target/fen/
          if-no-files-found: error

  lamp-load:
    name: lamp churn (20 bots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Task 10's stated load test. Release for the same reason the swarm is:
      # a debug build measures rustc's inlining decisions rather than the
      # lighting, and lighting is the whole point of this one.
      - name: Twenty bots placing and removing lamps
        run: cargo test -p bot --test lamp_load --release -- --ignored --nocapture

  entity-load:
    name: entity swarm (200 mobs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Task 12's stated load test. Two hundred scripted mobs in one area, each
      # running a Lua callback with its own instruction budget every tick, all
      # of them inside a viewer's cylinder so replication is measured too.
      - name: Two hundred scripted mobs for thirty seconds
        run: cargo test -p bot --test entity_load --release -- --ignored --nocapture

  serve-budget:
    name: expensive terrain (serve budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A mod generating terrain from a sampled density field, which is several
      # times what the reference world's flat fill costs. The engine may not
      # spend more than its share of the tick serving it however expensive a
      # chunk turns out to be, because a chunk's cost belongs to the mod. The
      # regression this guards is a count-shaped budget coming back: before the
      # clock, this workload dropped 94 of 386 ticks.
      - name: Terrain a mod paid for, for twenty-five seconds
        run: cargo test -p bot --test serve_budget --release -- --ignored --nocapture

  micro-bench:
    name: criterion micro-benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `cargo bench --workspace` builds the client, which links the audio
      # backend, which needs ALSA's headers on Linux. Nothing here plays a
      # sound — a runner has no device and the client carries on silently.
      - name: Audio build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # Not gated. Criterion's own noise threshold is tuned for a quiet machine,
      # and a shared runner is not one; these are for reading a trend, not for
      # blocking a merge.
      - name: Run the micro-benchmarks
        # `mkdir -p target` is load-bearing. `tee` opens its file before cargo
        # creates `target/`, and on a cache miss the directory is not there yet.
        # It then reports the error, keeps copying stdin to stdout, and exits 1
        # at the end — so the log holds a complete, healthy benchmark run, no
        # artifact is uploaded, and the job fails with nothing in it that looks
        # like a cause. Two nightlies were red on this before it was read.
        run: |
          mkdir -p target
          cargo bench --workspace 2>&1 | tee target/criterion-output.txt

      - name: Upload the criterion output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-${{ github.sha }}
          path: target/criterion-output.txt
          if-no-files-found: warn
