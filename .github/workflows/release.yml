#
# Builds the four targets a tester can download and puts them on a DRAFT
# release — see `docs/distribution.md` §8.
#
# **Draft, and nothing here signs anything.** The manifest that says what is
# authentic is signed on the maintainer's machine with a key that never enters
# CI: a private key in a repository secret is a private key that every workflow
# change can reach.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel to stamp into the build"
        required: false
        default: test

permissions:
  contents: write

jobs:
  # The draft release, made once before any archive exists, so the four
  # package legs never race to create it and never make two.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: The draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # `--draft` because docs/distribution.md §8 publishes by hand, after
          # the manifest is signed off the runner.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Tiamat $GITHUB_REF_NAME" \
              --notes "Unsigned test build. See docs/distribution.md for what to do with it."

  package:
    needs: draft
    # A dispatch run has no tag and no draft; it still packages.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || needs.draft.result == 'skipped') }}
    strategy:
      # One target failing must not cancel the others: three usable archives
      # and a known gap beats no archives at all when a release is being cut.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Macs, cross-compiled from the Apple Silicon runner: Apple's
          # SDK carries both architectures, so this needs no second runner.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    # **Signing turns itself on when the secrets exist** (milestone 0.5.0,
    # S3). A secret cannot be tested in an `if`, so each is folded into a
    # job-level flag here. Without them the build is the unsigned one it
    # always was, and the README says so.
    env:
      HAVE_APPLE_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
      HAVE_AZURE_SIGNING: ${{ secrets.AZURE_SIGNING_TENANT_ID != '' && secrets.AZURE_SIGNING_CLIENT_ID != '' && secrets.AZURE_SIGNING_CLIENT_SECRET != '' && secrets.AZURE_SIGNING_ENDPOINT != '' && secrets.AZURE_SIGNING_ACCOUNT != '' && secrets.AZURE_SIGNING_PROFILE != '' }}
      HAVE_PFX_SIGNING: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 != '' && secrets.WINDOWS_SIGN_PFX_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag and the workspace version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml ${declared}" >&2
            echo "A release whose binaries report a different version from the" >&2
            echo "tag they were cut from is one nobody can reason about." >&2
            exit 1
          fi

      - name: Install the pinned toolchain for this target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # The client links an audio backend, and on Linux that is ALSA. See the
      # README's system dependencies.
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Package
        shell: bash
        # The signing key's PUBLIC half is not here: it is `release-key.pub`
        # in the repository, so every build — CI's and anybody's — trusts the
        # same key and a change to it is a diff somebody can see. The private
        # half never comes near CI (docs/distribution.md §2 and §8).
        #
        # The manifest URL is a repository variable because it is deployment
        # rather than trust: a build pointed at the wrong URL fetches nothing,
        # and a build pointed at a hostile one still refuses everything it is
        # offered.
        env:
          TIAMAT_MANIFEST_URL: ${{ vars.TIAMAT_MANIFEST_URL }}
        run: |
          channel="${{ inputs.channel || 'test' }}"
          if [ -z "${TIAMAT_MANIFEST_URL:-}" ]; then
            echo "::warning::No TIAMAT_MANIFEST_URL variable is set, so this build"
            echo "::warning::will not look for updates. Set it under Settings ->"
            echo "::warning::Secrets and variables -> Actions -> Variables."
          fi
          bash scripts/package.sh --target ${{ matrix.target }} --channel "$channel" --stage-only

      # --- signing, between the stage and the archive --------------------
      #
      # The signature changes the executables' bytes, so it goes between the
      # two phases of package.sh: the file manifest and the archive are made
      # from the signed files. Each step runs only when its secrets exist;
      # docs/distribution.md §8a says what each secret is and where it comes
      # from.

      - name: Import the Developer ID certificate
        if: runner.os == 'macOS' && env.HAVE_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 16)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$(security list-keychains -d user | tr -d '" ')"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Sign and notarise (macOS)
        if: runner.os == 'macOS' && env.HAVE_APPLE_SIGNING == 'true'
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/sign-macos.sh "$(ls -d dist/tiamat-*-${{ matrix.target }})"

      - name: Sign (Windows, Azure Trusted Signing)
        if: runner.os == 'Windows' && env.HAVE_AZURE_SIGNING == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Record the Azure signature for the archive
        if: runner.os == 'Windows' && env.HAVE_AZURE_SIGNING == 'true'
        shell: bash
        run: touch "$(ls -d dist/tiamat-*-${{ matrix.target }})/.signed"

      - name: Sign (Windows, certificate file)
        if: runner.os == 'Windows' && env.HAVE_AZURE_SIGNING != 'true' && env.HAVE_PFX_SIGNING == 'true'
        shell: pwsh
        env:
          WINDOWS_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGN_PFX_BASE64 }}
          TIAMAT_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "sign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGN_PFX_BASE64))
          $env:TIAMAT_SIGN_PFX = $pfx
          $stage = (Get-ChildItem dist -Directory -Filter "tiamat-*-${{ matrix.target }}" | Select-Object -First 1).FullName
          try { & pwsh -File scripts/sign-windows.ps1 -Stage $stage; if ($LASTEXITCODE -ne 0) { throw "signing failed" } }
          finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Archive
        shell: bash
        run: bash scripts/package.sh --archive-from "$(ls -d dist/tiamat-*-${{ matrix.target }})"

      # Counsel's rule: look inside the archive a tester will download, rather
      # than trusting the configuration that produced it. Every licence file,
      # the release record, the bundled mods and the file manifest.
      - name: The archive carries what a release has to carry
        shell: bash
        run: |
          for archive in dist/tiamat-*.tar.gz dist/tiamat-*.zip; do
            [ -f "$archive" ] || continue
            case "$archive" in *-source.tar.gz) continue ;; esac
            bash scripts/check-archive.sh "$archive"
          done

      # The corresponding source, once, from the Linux leg: the engine at this
      # commit and every bundled mod at the commit bundle.toml pins, so an
      # older binary has a source that does not move.
      - name: Source archive
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/source-archive.sh --out dist

      # Kept whatever happens, so a dispatch run with no tag still produces
      # something to download and try.
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the archives this leg made: a Linux leg has no .zip and a
          # Windows leg no .tar.gz, and an unmatched glob handed to gh as a
          # literal path is exactly how the first tag's run ended.
          shopt -s nullglob
          files=(dist/tiamat-*.tar.gz dist/tiamat-*.zip)
          echo "uploading: ${files[*]}"
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
