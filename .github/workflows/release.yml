#
# Builds the four targets a tester can download and puts them on a DRAFT
# release — see `docs/distribution.md` §8.
#
# **Draft, and nothing here signs anything.** The manifest that says what is
# authentic is signed on the maintainer's machine with a key that never enters
# CI: a private key in a repository secret is a private key that every workflow
# change can reach.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Update channel to stamp into the build"
        required: false
        default: test

permissions:
  contents: write

jobs:
  package:
    strategy:
      # One target failing must not cancel the others: three usable archives
      # and a known gap beats no archives at all when a release is being cut.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Intel Macs, cross-compiled from the Apple Silicon runner: Apple's
          # SDK carries both architectures, so this needs no second runner.
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: The tag and the workspace version must agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [ "$tagged" != "$declared" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml ${declared}" >&2
            echo "A release whose binaries report a different version from the" >&2
            echo "tag they were cut from is one nobody can reason about." >&2
            exit 1
          fi

      - name: Install the pinned toolchain for this target
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      # The client links an audio backend, and on Linux that is ALSA. See the
      # README's system dependencies.
      - name: ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Package
        shell: bash
        # The signing key's PUBLIC half is not here: it is `release-key.pub`
        # in the repository, so every build — CI's and anybody's — trusts the
        # same key and a change to it is a diff somebody can see. The private
        # half never comes near CI (docs/distribution.md §2 and §8).
        #
        # The manifest URL is a repository variable because it is deployment
        # rather than trust: a build pointed at the wrong URL fetches nothing,
        # and a build pointed at a hostile one still refuses everything it is
        # offered.
        env:
          TIAMAT_MANIFEST_URL: ${{ vars.TIAMAT_MANIFEST_URL }}
        run: |
          channel="${{ inputs.channel || 'test' }}"
          if [ -z "${TIAMAT_MANIFEST_URL:-}" ]; then
            echo "::warning::No TIAMAT_MANIFEST_URL variable is set, so this build"
            echo "::warning::will not look for updates. Set it under Settings ->"
            echo "::warning::Secrets and variables -> Actions -> Variables."
          fi
          scripts/package.sh --target ${{ matrix.target }} --channel "$channel"

      # Counsel's rule: look inside the archive a tester will download, rather
      # than trusting the configuration that produced it. Every licence file,
      # the release record, the bundled mods and the file manifest.
      - name: The archive carries what a release has to carry
        shell: bash
        run: |
          for archive in dist/tiamat-*.tar.gz dist/tiamat-*.zip; do
            [ -f "$archive" ] || continue
            case "$archive" in *-source.tar.gz) continue ;; esac
            scripts/check-archive.sh "$archive"
          done

      # The corresponding source, once, from the Linux leg: the engine at this
      # commit and every bundled mod at the commit bundle.toml pins, so an
      # older binary has a source that does not move.
      - name: Source archive
        if: runner.os == 'Linux'
        shell: bash
        run: scripts/source-archive.sh --out dist

      # Kept whatever happens, so a dispatch run with no tag still produces
      # something to download and try.
      - uses: actions/upload-artifact@v4
        with:
          name: tiamat-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Attach to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Created on the first target to finish and reused by the rest;
          # `--draft` because §8 publishes by hand, after the manifest is
          # signed off the runner.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" \
              --draft \
              --title "Tiamat $GITHUB_REF_NAME" \
              --notes "Unsigned test build. See docs/distribution.md for what to do with it."
          gh release upload "$GITHUB_REF_NAME" dist/tiamat-*.tar.gz dist/tiamat-*.zip --clobber
