[package]
name = "registry"
description = "The Tiamat name registry: certificates, names, and recovery."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# No GUI, no rendering, no simulation. The registry answers HTTP, writes SQLite,
# and signs with the registry key — that is its whole job (charter rule 2: no
# network in the join path; this service is the one that is *not* called there).
#
# `default-features = false` keeps the scripting VM out of the image: this crate
# uses `identity`, `keyset` and `release`, none of which need Lua, and the
# service has no mods to run. Spelled as a path dependency rather than
# `.workspace = true` because Cargo does not let a member override a workspace
# dependency's default features; the workspace's other consumers keep the
# defaults they already rely on.
[dependencies]
tiamat-core = { path = "../core", default-features = false }
blake3.workspace = true
clap.workspace = true
ctrlc.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
# SMTP for the two mails; default features are off in the workspace so this
# does not pull openssl-sys (deny.toml forbids it).
lettre.workspace = true
postcard.workspace = true
rusqlite.workspace = true
serde.workspace = true
thiserror.workspace = true
tiny_http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lib]
name = "tiamat_registry"
path = "src/lib.rs"

[[bin]]
name = "registry"
path = "src/main.rs"
