[package]
name = "relman"
description = "Release manager: hashes a dist directory into a manifest, and signs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

# **Deliberately tiny, and deliberately offline.** This is the program that
# decides what is authentic (`docs/distribution.md` §8), it runs on the
# maintainer's machine with the signing key, and it speaks to no network: a
# tool that could fetch could be made to fetch.
[dependencies]
tiamot-core.workspace = true
blake3.workspace = true
clap.workspace = true
ed25519-dalek.workspace = true
getrandom.workspace = true
serde_json = "1.0.151"
